<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lista de Tarefas</title>
  <style>
    /* CORES (variáveis): claro por padrão, escuro igual ao seu portfólio */
    :root {
      --bg: #f4f6f8; --card: #ffffff; --text: #111111; --muted: #667085;
      --accent: #007d65; --on-accent: #ffffff; --border: #dde2e8;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f0f0f; --card: #1a1a1a; --text: #ffffff; --muted: #aaaaaa;
        --accent: #00ffcc; --on-accent: #000000; --border: #2a2a2a;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f0f0f; --card: #1a1a1a; --text: #ffffff; --muted: #aaaaaa;
      --accent: #00ffcc; --on-accent: #000000; --border: #2a2a2a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 40px 16px; }

    .app { max-width: 560px; margin: 0 auto; }
    h1 { text-align: center; font-size: clamp(26px, 6vw, 38px); margin-bottom: 6px; }
    h1 span { color: var(--accent); }
    .sub { text-align: center; color: var(--muted); margin-bottom: 28px; }

    .box { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; }

    form { display: flex; gap: 10px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 16px;
    }
    button { cursor: pointer; border: none; border-radius: 10px; font-weight: bold; }
    .add { padding: 12px 18px; background: var(--accent); color: var(--on-accent); font-size: 16px; }
    :is(button, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .filtros { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filtro { padding: 8px 14px; background: transparent; color: var(--muted); border: 1px solid var(--border); font-size: 14px; }
    .filtro.ativo { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

    ul { list-style: none; }
    li { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border); }
    li:last-child { border-bottom: none; }
    li input { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; }
    li span { flex: 1; overflow-wrap: anywhere; }
    li.feita span { text-decoration: line-through; color: var(--muted); }
    .apagar { background: transparent; color: var(--muted); font-size: 20px; padding: 4px 10px; }
    .apagar:hover { color: #ff5a5f; }

    .vazio { text-align: center; color: var(--muted); padding: 24px 0; }
    .rodape { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .limpar { background: transparent; color: var(--muted); text-decoration: underline; font-weight: normal; }
    .limpar:hover { color: var(--text); }
  </style>
</head>
<body>
  <main class="app">
    <h1>Minhas <span>Tarefas</span></h1>
    <p class="sub">Suas tarefas ficam salvas neste navegador.</p>

    <div class="box">
      <form id="form">
        <input type="text" id="entrada" placeholder="O que você precisa fazer?" maxlength="100" autocomplete="off" aria-label="Nova tarefa">
        <button type="submit" class="add">Adicionar</button>
      </form>

      <div class="filtros" id="filtros">
        <button class="filtro ativo" data-filtro="todas">Todas</button>
        <button class="filtro" data-filtro="pendentes">Pendentes</button>
        <button class="filtro" data-filtro="concluidas">Concluídas</button>
      </div>

      <ul id="lista"></ul>

      <div class="rodape">
        <span id="contador"></span>
        <button class="limpar" id="limpar">Limpar concluídas</button>
      </div>
    </div>
  </main>

  <script>
    const CHAVE = "tarefas-jackson";

    // Pega os elementos da página
    const form = document.getElementById("form");
    const entrada = document.getElementById("entrada");
    const lista = document.getElementById("lista");
    const contador = document.getElementById("contador");

    let filtroAtual = "todas";
    let tarefas = carregar();

    // LOCALSTORAGE: lê e grava as tarefas (try/catch porque o navegador pode bloquear)
    function carregar() {
      try {
        const salvo = localStorage.getItem(CHAVE);
        return salvo ? JSON.parse(salvo) : [];
      } catch (erro) {
        return [];
      }
    }

    function salvar() {
      try {
        localStorage.setItem(CHAVE, JSON.stringify(tarefas));
      } catch (erro) {
        // se não der para salvar, o app continua funcionando só nesta sessão
      }
    }

    // DESENHA a lista na tela
    function renderizar() {
      lista.innerHTML = "";

      const visiveis = tarefas.filter(t => {
        if (filtroAtual === "pendentes") return !t.feita;
        if (filtroAtual === "concluidas") return t.feita;
        return true;
      });

      if (visiveis.length === 0) {
        const vazio = document.createElement("p");
        vazio.className = "vazio";
        vazio.textContent = "Nenhuma tarefa por aqui.";
        lista.appendChild(vazio);
      }

      visiveis.forEach(tarefa => {
        const item = document.createElement("li");
        if (tarefa.feita) item.classList.add("feita");

        const caixa = document.createElement("input");
        caixa.type = "checkbox";
        caixa.checked = tarefa.feita;
        caixa.setAttribute("aria-label", "Concluir tarefa");
        caixa.addEventListener("change", () => {
          tarefa.feita = caixa.checked;
          salvar();
          renderizar();
        });

        // textContent (e não innerHTML) evita que alguém injete código no texto
        const texto = document.createElement("span");
        texto.textContent = tarefa.texto;

        const apagar = document.createElement("button");
        apagar.className = "apagar";
        apagar.textContent = "✕";
        apagar.setAttribute("aria-label", "Apagar tarefa");
        apagar.addEventListener("click", () => {
          tarefas = tarefas.filter(t => t.id !== tarefa.id);
          salvar();
          renderizar();
        });

        item.append(caixa, texto, apagar);
        lista.appendChild(item);
      });

      const pendentes = tarefas.filter(t => !t.feita).length;
      contador.textContent = pendentes === 1 ? "1 tarefa pendente" : pendentes + " tarefas pendentes";
    }

    // ADICIONAR tarefa (o form também funciona com a tecla Enter)
    form.addEventListener("submit", evento => {
      evento.preventDefault();
      const texto = entrada.value.trim();
      if (texto === "") return;

      tarefas.push({ id: Date.now(), texto: texto, feita: false });
      entrada.value = "";
      salvar();
      renderizar();
    });

    // FILTROS
    document.getElementById("filtros").addEventListener("click", evento => {
      const botao = evento.target.closest(".filtro");
      if (!botao) return;

      filtroAtual = botao.dataset.filtro;
      document.querySelectorAll(".filtro").forEach(b => b.classList.remove("ativo"));
      botao.classList.add("ativo");
      renderizar();
    });

    // LIMPAR concluídas
    document.getElementById("limpar").addEventListener("click", () => {
      tarefas = tarefas.filter(t => !t.feita);
      salvar();
      renderizar();
    });

    renderizar();
  </script>
</body>
</html>
